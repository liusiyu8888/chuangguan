<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百科知识大闯关 · 离线版</title>
<style>
  :root{
    --bg:#050816; --panel:rgba(15,23,42,.72); --line:rgba(34,211,238,.28);
    --cyan:#22d3ee; --violet:#a78bfa; --pink:#f472b6; --green:#34d399; --red:#fb7185;
    --text:#e2e8f0; --dim:#94a3b8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;background:var(--bg);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background-image:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(34,211,238,.15), transparent),
      radial-gradient(ellipse 60% 40% at 90% 0%, rgba(167,139,250,.16), transparent),
      linear-gradient(rgba(34,211,238,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,.05) 1px, transparent 1px);
    background-size:auto,auto,42px 42px,42px 42px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
  .hidden{display:none!important}
  .glow-title{
    font-size:42px;font-weight:900;letter-spacing:3px;text-align:center;
    background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6,#22d3ee);
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 6s linear infinite;text-shadow:0 0 40px rgba(34,211,238,.35);
  }
  @keyframes shine{to{background-position:250% 0}}
  .sub{text-align:center;color:var(--dim);letter-spacing:6px;margin:8px 0 26px;font-size:14px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:22px;margin-bottom:16px;backdrop-filter:blur(8px);
    box-shadow:0 0 24px rgba(34,211,238,.08), inset 0 0 30px rgba(34,211,238,.03);
  }
  .btn{
    display:block;width:100%;padding:15px;border-radius:12px;border:1px solid transparent;
    font-size:16px;font-weight:700;cursor:pointer;color:#fff;letter-spacing:2px;
    background:linear-gradient(90deg,#0891b2,#7c3aed);transition:.18s;text-align:center;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(124,58,237,.4)}
  .btn:active{transform:translateY(0)}
  .btn-ghost{
    background:transparent;border:1px solid var(--line);color:var(--cyan);
  }
  .btn-ghost:hover{background:rgba(34,211,238,.08);box-shadow:0 0 18px rgba(34,211,238,.2)}
  .btn-danger{background:transparent;border:1px solid rgba(251,113,133,.5);color:var(--red);font-weight:600}
  .btn-danger:hover{background:rgba(251,113,133,.1);box-shadow:none}
  .row{display:flex;gap:12px}
  .row .btn{flex:1}
  .stat{display:flex;justify-content:space-between;font-size:14px;color:var(--dim);margin-bottom:10px}
  .stat b{color:var(--cyan);font-size:18px}
  .bar{height:8px;border-radius:99px;background:rgba(148,163,184,.15);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#a78bfa);transition:width .4s}
  .q-tag{display:inline-block;font-size:12px;color:var(--cyan);border:1px solid var(--line);border-radius:99px;padding:3px 12px;margin-bottom:14px;letter-spacing:2px}
  .q-text{font-size:19px;line-height:1.7;font-weight:600;margin-bottom:20px}
  .opt{
    display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:12px;border-radius:12px;
    background:rgba(30,41,59,.6);border:1px solid rgba(148,163,184,.18);color:var(--text);
    font-size:15px;cursor:pointer;transition:.15s;line-height:1.6;
  }
  .opt:hover:not(:disabled){border-color:var(--cyan);background:rgba(34,211,238,.08)}
  .opt .key{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:8px;background:rgba(34,211,238,.12);color:var(--cyan);font-weight:800;margin-right:10px;font-size:13px}
  .opt.correct{background:rgba(52,211,153,.18);border-color:var(--green);color:#a7f3d0}
  .opt.wrong{background:rgba(251,113,133,.15);border-color:var(--red);color:#fecdd3}
  .opt:disabled{cursor:default;opacity:.85}
  .msg{padding:12px 16px;border-radius:10px;margin-top:6px;font-size:14px;font-weight:700;letter-spacing:1px}
  .msg.ok{background:rgba(52,211,153,.12);color:#6ee7b7;border:1px solid rgba(52,211,153,.35)}
  .msg.err{background:rgba(251,113,133,.12);color:#fda4af;border:1px solid rgba(251,113,133,.35)}
  .msg.info{background:rgba(34,211,238,.1);color:#67e8f9;border:1px solid rgba(34,211,238,.3)}
  .win-box{text-align:center;padding:28px 10px}
  .win-emoji{font-size:64px;animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  .win-title{font-size:30px;font-weight:900;margin:14px 0 6px;background:linear-gradient(90deg,#34d399,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .win-sub{color:var(--dim);font-size:15px;margin-bottom:22px}
  .learn-item{margin-bottom:14px}
  .learn-q{font-size:16px;font-weight:600;line-height:1.6;margin-bottom:10px}
  .learn-ans{display:none;margin-top:10px;padding:12px 14px;border-radius:10px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3);font-size:14px;line-height:1.7}
  .learn-ans.show{display:block}
  .learn-ans b{color:#6ee7b7}
  .foot{text-align:center;color:var(--dim);font-size:12px;margin-top:26px;letter-spacing:1px}
  .pick{width:100%;padding:12px 14px;border-radius:10px;background:rgba(30,41,59,.6);border:1px solid var(--line);color:var(--text);font-size:15px;margin-bottom:14px}
  .pick:focus{outline:none;border-color:var(--cyan)}
  h2.sec{font-size:20px;font-weight:800;letter-spacing:2px;margin-bottom:14px;color:var(--cyan)}
  .back{margin-bottom:18px}
  .rules li{margin:8px 0;color:var(--dim);font-size:14px;line-height:1.8}
  .rules li b{color:var(--text)}
  .rules{padding-left:2px;list-style:none}
  .rules li::before{content:"▸ ";color:var(--violet)}
  .lvl-chip{display:inline-block;background:rgba(167,139,250,.12);color:#c4b5fd;border:1px solid rgba(167,139,250,.35);border-radius:99px;padding:2px 10px;font-size:12px;margin-right:6px}
</style>
</head>
<body>
<div class="wrap">

  <!-- ========== 首页 ========== -->
  <div id="view-home">
    <h1 class="glow-title">百科知识大闯关</h1>
    <div class="sub">AI × 百科 · 40 关知识挑战</div>
    <div class="card">
      <div class="stat"><span>已通关</span><b id="stat-clear">0</b></div>
      <div class="stat"><span>可挑战</span><b id="stat-next">第 1 关</b></div>
      <div class="bar"><i id="stat-bar" style="width:0%"></i></div>
    </div>
    <div class="card">
      <div class="row">
        <button class="btn" onclick="startGame()">🚀 开始闯关</button>
        <button class="btn btn-ghost" onclick="showLearn()">📖 学习模式</button>
      </div>
      <div style="height:10px"></div>
      <label style="font-size:13px;color:var(--dim);letter-spacing:1px">选择关卡（已解锁范围内）：</label>
      <select id="pick-level" class="pick" onchange="startGame(parseInt(this.value))"></select>
      <button class="btn btn-danger" onclick="resetProgress()">🔄 重置进度</button>
    </div>
    <div class="card rules">
      <h2 class="sec" style="margin-bottom:6px">玩法规则</h2>
      <ul>
        <li>共 <b>40 关</b>，每关 <b>5 道题</b></li>
        <li>5 题<b>全部答对</b>才能进入下一关</li>
        <li>答错会提示正确答案，并<b>重新挑战本关</b></li>
        <li>进度自动保存在本机浏览器，关闭后不丢失</li>
      </ul>
    </div>
  </div>

  <!-- ========== 闯关页 ========== -->
  <div id="view-play" class="hidden">
    <div class="card">
      <div class="stat">
        <span>第 <b id="play-level">1</b> 关</span>
        <span id="play-count">第 1 / 5 题</span>
      </div>
      <div class="bar"><i id="play-bar" style="width:20%"></i></div>
    </div>
    <div class="card" id="play-card">
      <div class="q-tag" id="play-tag">挑战</div>
      <div class="q-text" id="play-q"></div>
      <div id="play-opts"></div>
      <div id="play-msg"></div>
    </div>
    <div class="card hidden" id="play-win">
      <div class="win-box">
        <div class="win-emoji">🏆</div>
        <div class="win-title" id="win-title">全对！闯关成功</div>
        <div class="win-sub" id="win-sub">即将进入下一关</div>
        <div class="row">
          <button class="btn" id="win-next-btn" onclick="nextLevel()">进入下一关 →</button>
          <button class="btn btn-ghost" onclick="showHome()">返回首页</button>
        </div>
      </div>
    </div>
    <div class="card hidden" id="play-final">
      <div class="win-box">
        <div class="win-emoji">🎓</div>
        <div class="win-title">恭喜通关全部 40 关！</div>
        <div class="win-sub">你就是百科知识大王 🏅</div>
        <button class="btn" onclick="showHome()">返回首页</button>
      </div>
    </div>
    <button class="btn btn-ghost back" onclick="showHome()">← 返回首页</button>
  </div>

  <!-- ========== 学习模式 ========== -->
  <div id="view-learn" class="hidden">
    <button class="btn btn-ghost back" onclick="showHome()">← 返回首页</button>
    <h2 class="sec">📖 学习模式 · 浏览全部题目</h2>
    <div class="card">
      <label style="font-size:13px;color:var(--dim);letter-spacing:1px">按关卡筛选：</label>
      <select id="learn-filter" class="pick" onchange="renderLearn()">
        <option value="0">全部题目（200 题）</option>
      </select>
      <div id="learn-list"></div>
    </div>
  </div>

  <div class="foot">百科知识大闯关 · 离线版（单文件，双击即玩）</div>
</div>

<script>
/* ================= 题库数据（构建时自动嵌入 200 题） ================= */
const QUESTIONS = __QUESTIONS_JSON__;
const TOTAL_LEVELS = 40;
const PER_LEVEL = 5;
const LS_KEY = 'baike_quiz_offline_v1';

/* ================= 进度存取 ================= */
function loadProgress(){
  try{ const p = JSON.parse(localStorage.getItem(LS_KEY)); if(p && p.unlocked>=1) return p; }catch(e){}
  return {unlocked:1};
}
function saveProgress(p){ try{ localStorage.setItem(LS_KEY, JSON.stringify(p)); }catch(e){} }
let progress = loadProgress();

/* ================= 音效（Web Audio，无需外部文件） ================= */
let actx = null;
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==='suspended') actx.resume(); return actx; }
function tone(freq, start, dur, type='sine', vol=.18){
  const a = audio(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, a.currentTime+start);
  g.gain.linearRampToValueAtTime(vol, a.currentTime+start+.02);
  g.gain.exponentialRampToValueAtTime(.001, a.currentTime+start+dur);
  o.connect(g); g.connect(a.destination);
  o.start(a.currentTime+start); o.stop(a.currentTime+start+dur+.05);
}
const sfx = {
  click(){ tone(660,.0,.08,'triangle',.12); },
  correct(){ tone(523,.0,.12,'triangle'); tone(784,.09,.16,'triangle'); },
  wrong(){ tone(220,.0,.22,'sawtooth',.14); tone(180,.12,.25,'sawtooth',.12); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.28,'triangle',.16)); },
  final(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.4,'triangle',.18)); }
};

/* ================= 视图切换 ================= */
const views = ['view-home','view-play','view-learn'];
function show(name){
  views.forEach(v => document.getElementById(v).classList.toggle('hidden', v!==name));
  window.scrollTo(0,0);
}
function showHome(){ show('view-home'); renderHome(); }
function showLearn(){ show('view-learn'); buildLearnFilter(); renderLearn(); }

/* ================= 首页 ================= */
function renderHome(){
  const cleared = progress.unlocked - 1;
  document.getElementById('stat-clear').textContent = cleared + ' / 40 关';
  document.getElementById('stat-next').textContent = '第 ' + Math.min(progress.unlocked, TOTAL_LEVELS) + ' 关';
  document.getElementById('stat-bar').style.width = (cleared/40*100) + '%';
  const sel = document.getElementById('pick-level');
  sel.innerHTML = '';
  for(let l=1; l<=Math.min(progress.unlocked, TOTAL_LEVELS); l++){
    const o = document.createElement('option');
    o.value = l; o.textContent = '第 ' + l + ' 关' + (l===1 && progress.unlocked===1 ? '（当前）' : '');
    sel.appendChild(o);
  }
}
function startGame(level){
  const p = loadProgress();
  const target = level || Math.min(p.unlocked, TOTAL_LEVELS);
  progress = p;
  beginLevel(target);
  show('view-play');
  sfx.click();
}

/* ================= 闯关逻辑 ================= */
let state = { level:1, qIndex:0, answered:false };
function questionsOf(level){ return QUESTIONS.filter(q => q.level === level).slice(0, PER_LEVEL); }
function beginLevel(level){
  state = { level, qIndex:0, answered:false };
  renderQuestion();
}
function renderQuestion(){
  document.getElementById('play-win').classList.add('hidden');
  document.getElementById('play-final').classList.add('hidden');
  const qs = questionsOf(state.level);
  if(!qs.length){ show('view-home'); return; }
  const q = qs[state.qIndex];
  document.getElementById('play-level').textContent = state.level;
  document.getElementById('play-count').textContent = '第 ' + (state.qIndex+1) + ' / ' + PER_LEVEL + ' 题';
  document.getElementById('play-bar').style.width = ((state.qIndex+1)/PER_LEVEL*100) + '%';
  document.getElementById('play-q').textContent = q.text;
  const opts = [['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].filter(o=>o[1]);
  const box = document.getElementById('play-opts');
  box.innerHTML = '';
  opts.forEach(([k,txt], i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="key">' + k + '</span>' + txt;
    b.onclick = () => answer(k, b, opts);
    box.appendChild(b);
  });
  document.getElementById('play-msg').innerHTML = '';
  state.answered = false;
}
function answer(key, btn, opts){
  if(state.answered) return;
  state.answered = true;
  const q = questionsOf(state.level)[state.qIndex];
  const msgBox = document.getElementById('play-msg');
  const allBtns = document.querySelectorAll('#play-opts .opt');
  allBtns.forEach(b => b.disabled = true);
  if(key === q.answer){
    btn.classList.add('correct');
    sfx.correct();
    msgBox.innerHTML = '<div class="msg ok">✅ 回答正确！</div>';
    if(state.qIndex + 1 >= PER_LEVEL){
      // 本关 5 题全对 → 过关
      sfx.win();
      showWin();
    } else {
      setTimeout(() => { state.qIndex++; renderQuestion(); }, 900);
    }
  } else {
    btn.classList.add('wrong');
    sfx.wrong();
    // 高亮正确答案
    const opts = [['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].filter(o=>o[1]);
    opts.forEach(([k]) => {
      if(k === q.answer){
        allBtns.forEach(b => { if(b.querySelector('.key').textContent === k) b.classList.add('correct'); });
      }
    });
    msgBox.innerHTML = '<div class="msg err">❌ 回答错误！正确答案是 ' + q.answer + '。本关重新开始…</div>';
    setTimeout(() => { beginLevel(state.level); }, 1800);
  }
}
function showWin(){
  document.getElementById('play-win').classList.remove('hidden');
  if(state.level >= TOTAL_LEVELS){
    document.getElementById('win-title').textContent = '全部通关！';
    document.getElementById('win-sub').textContent = '你已通过全部 40 关 🎉';
    document.getElementById('win-next-btn').textContent = '🏆 我已通关';
    document.getElementById('win-next-btn').onclick = () => showFinal();
  } else {
    const next = state.level + 1;
    document.getElementById('win-title').textContent = '全对！闯关成功';
    document.getElementById('win-sub').textContent = '第 ' + state.level + ' 关完成，准备进入第 ' + next + ' 关';
    document.getElementById('win-next-btn').textContent = '进入第 ' + next + ' 关 →';
    document.getElementById('win-next-btn').onclick = () => nextLevel();
  }
  // 解锁下一关
  progress = loadProgress();
  if(progress.unlocked < state.level + 1) progress.unlocked = state.level + 1;
  saveProgress(progress);
}
function showFinal(){
  document.getElementById('play-win').classList.add('hidden');
  document.getElementById('play-final').classList.remove('hidden');
  sfx.final();
}
function nextLevel(){
  const next = state.level + 1;
  if(next > TOTAL_LEVELS){ showFinal(); return; }
  beginLevel(next);
  sfx.click();
}
function resetProgress(){
  sfx.click();
  if(confirm('确定要重置全部闯关进度吗？将从第 1 关重新开始。')){
    progress = {unlocked:1};
    saveProgress(progress);
    renderHome();
    alert('✅ 进度已重置，从第 1 关开始！');
  }
}

/* ================= 学习模式 ================= */
function buildLearnFilter(){
  const sel = document.getElementById('learn-filter');
  sel.innerHTML = '<option value="0">全部题目（200 题）</option>';
  for(let l=1; l<=TOTAL_LEVELS; l++){
    const o = document.createElement('option');
    o.value = l; o.textContent = '第 ' + l + ' 关（' + l + ' ~ ' + (l*5) + ' 题）';
    sel.appendChild(o);
  }
  sel.value = '0';
}
function renderLearn(){
  const filter = parseInt(document.getElementById('learn-filter').value);
  const qs = filter ? questionsOf(filter) : QUESTIONS.slice();
  const list = document.getElementById('learn-list');
  list.innerHTML = '';
  qs.forEach((q, idx) => {
    const item = document.createElement('div');
    item.className = 'learn-item card';
    const opts = [['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].filter(o=>o[1]);
    const optHtml = opts.map(([k,t]) => '<div style="font-size:13px;color:var(--dim);margin:4px 0"><span class="lvl-chip">' + k + '</span>' + t + '</div>').join('');
    const exp = q.explanation ? '<div style="margin-top:8px;color:var(--dim);font-size:13px">💡 ' + q.explanation + '</div>' : '';
    item.innerHTML =
      '<div class="learn-q"><span class="lvl-chip">第 ' + q.level + ' 关 · ' + (idx+1) + '</span>' + q.text + '</div>' +
      '<div>' + optHtml + '</div>' +
      '<div class="learn-ans" id="ans-' + (filter?('f'+q.level+'-'+idx):('a'+idx)) + '"><b>✅ 正确答案：' + q.answer + '</b>' + exp + '</div>' +
      '<button class="btn btn-ghost" style="padding:9px;font-size:13px;margin-top:10px" onclick="toggleAns(this)">👁 显示答案</button>';
    list.appendChild(item);
  });
}
function toggleAns(btn){
  sfx.click();
  const ans = btn.previousElementSibling;
  if(ans.classList.contains('show')){
    ans.classList.remove('show');
    btn.textContent = '👁 显示答案';
  } else {
    ans.classList.add('show');
    btn.textContent = '🙈 隐藏答案';
  }
}

/* ================= 启动 ================= */
renderHome();
document.addEventListener('click', () => audio(), {once:true});
</script>
</body>
</html>
