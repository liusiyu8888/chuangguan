<div class="panel-wrong rounded-2xl p-6">
  <div class="flex items-center gap-3 mb-4">
    <span class="text-4xl">❌</span>
    <div>
      <div class="text-xl font-extrabold text-glow-wrong">答错了，本关需要重新挑战！</div>
      <div class="text-sm text-slate-400">全对才能过关，加油再来一次</div>
    </div>
  </div>

  <div class="explain-box rounded-xl p-4 mb-4 text-sm">
    <div class="mb-1">正确答案是：<b class="text-rose-400">{{ question.answer }}. {{ correct_text }}</b></div>
    {% if question.explanation %}
    <div class="text-slate-400 mt-2"><span class="font-semibold">📖 解析：</span>{{ question.explanation }}</div>
    {% endif %}
  </div>

  <div class="flex gap-3">
    <button
      class="flex-1 border border-rose-500/60 text-rose-300 hover:bg-rose-500/10 hover:border-rose-400 font-bold rounded-xl py-3 transition"
      hx-post="/restart"
      hx-target="#question-area"
      hx-swap="innerHTML">
      重新挑战本关 ↻
    </button>
    <a href="/" class="px-4 py-3 text-slate-500 hover:text-cyan-300 text-sm flex items-center transition">退出</a>
  </div>
</div>
<script>if (window.playSfx) playSfx("wrong");</script>
