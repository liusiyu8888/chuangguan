<div class="panel-clear rounded-2xl p-8 text-center panel-in">
  <div class="text-6xl mb-4">🎉</div>
  <h2 class="text-2xl font-extrabold text-glow-clear-big mb-2">恭喜过关！</h2>
  <p class="text-slate-400 mb-2">你已通关<b class="text-amber-300">第 {{ cleared_level }} 关</b>，{{ questions_per_level }} 题全部答对！</p>
  {% if question.explanation %}
  <div class="explain-box rounded-xl p-4 mb-6 text-sm text-left">
    <span class="font-semibold text-amber-400">📖 解析：</span>{{ question.explanation }}
  </div>
  {% endif %}

  <a href="/play"
     class="btn-neon inline-block w-full text-white font-bold rounded-xl py-3">
    进入第 {{ current_level }} 关 →
  </a>
  <a href="/" class="inline-block mt-3 text-sm text-slate-500 hover:text-cyan-300 transition">返回首页</a>
</div>
<script>if (window.playSfx) playSfx("clear");</script>
