{% extends "base.html" %}

{% block title %}学习模式 · 百科知识大闯关{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
  <!-- 顶部：返回 + 标题 -->
  <div class="flex items-center justify-between mb-6">
    <a href="/" class="text-slate-500 hover:text-cyan-300 text-sm flex items-center gap-1 transition">
      <span>←</span> 返回首页
    </a>
    <div class="text-center">
      <div class="text-2xl font-extrabold neon-title">📖 学习模式</div>
      <div class="text-xs text-slate-500 tracking-widest">浏览全部题目 · 答案先隐藏，点击即显示</div>
    </div>
    <div class="w-16"></div>
  </div>

  <!-- 关卡切换 -->
  <div class="tech-card rounded-2xl p-4 mb-6 panel-in">
    <div class="flex items-center gap-3">
      <a href="/learn"
         hx-get="/learn/level/{{ level - 1 if level > 1 else 1 }}"
         hx-target="#learn-list"
         hx-swap="innerHTML"
         class="btn-ghost text-sm px-4 py-2 rounded-lg {{ 'pointer-events-none opacity-40' if level <= 1 }}">
        ← 上一关
      </a>
      <div class="flex-1 text-center">
        <span class="badge-cyber text-sm font-medium px-4 py-1.5 rounded-full">第 {{ level }} / {{ total_levels }} 关</span>
      </div>
      <a href="/learn"
         hx-get="/learn/level/{{ level + 1 if level < total_levels else total_levels }}"
         hx-target="#learn-list"
         hx-swap="innerHTML"
         class="btn-ghost text-sm px-4 py-2 rounded-lg {{ 'pointer-events-none opacity-40' if level >= total_levels }}">
        下一关 →
      </a>
    </div>
  </div>

  <!-- 题目列表：HTMX 就地替换 -->
  <div id="learn-list">
    {% include "fragments/learn_list.html" %}
  </div>
</div>
{% endblock %}
