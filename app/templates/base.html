<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}百科知识大闯关{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <script>
    /* 轻量音效引擎：Web Audio 实时合成，答对 / 答错 / 过关三种音效，无需任何音频文件 */
    (function () {
      var ctx = null;
      function ensureCtx() {
        if (!ctx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) ctx = new AC();
        }
        if (ctx && ctx.state === "suspended") ctx.resume();
        return ctx;
      }
      function tone(freq, delay, dur, type, vol) {
        var c = ensureCtx();
        if (!c) return;
        var t = c.currentTime + delay;
        var osc = c.createOscillator();
        var g = c.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g);
        g.connect(c.destination);
        osc.start(t);
        osc.stop(t + dur + 0.05);
      }
      window.playSfx = function (name) {
        if (name === "correct") {
          tone(659, 0, 0.14, "sine");
          tone(880, 0.1, 0.2, "sine");
        } else if (name === "wrong") {
          tone(196, 0, 0.3, "sawtooth", 0.1);
          tone(147, 0.06, 0.34, "sawtooth", 0.1);
        } else if (name === "clear") {
          tone(523, 0, 0.16, "sine");
          tone(659, 0.13, 0.16, "sine");
          tone(784, 0.26, 0.16, "sine");
          tone(1046, 0.39, 0.4, "sine", 0.22);
        } else if (name === "win") {
          /* 全关大满贯：更长更隆重的庆祝旋律 */
          tone(523, 0, 0.15, "sine");
          tone(659, 0.12, 0.15, "sine");
          tone(784, 0.24, 0.15, "sine");
          tone(1046, 0.36, 0.18, "sine");
          tone(784, 0.52, 0.15, "triangle");
          tone(1046, 0.64, 0.15, "triangle");
          tone(1318, 0.76, 0.3, "sine", 0.24);
          tone(1568, 0.88, 0.5, "sine", 0.26);
        }
      };
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen tech-grid text-slate-200">
  <div class="relative z-10">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
