<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百科知识大闯关</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-grid"></div>

  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="logo">🚀</span> 百科知识大闯关
    </a>
    <nav class="nav-links">
      <a class="btn btn-ghost btn-sm" href="study.html">📚 学习模式</a>
      <a class="btn btn-ghost btn-sm" href="game.html">▶ 开始闯关</a>
    </nav>
  </header>

  <main class="wrap">
    <!-- Hero -->
    <section class="hero">
      <h1>百科知识大闯关</h1>
      <p class="sub">AI × 百科 · 每关 5 题全对通关 · 共 40 关</p>
      <div class="stats">
        <div class="stat"><div class="num" id="stat-levels">40</div><div class="lbl">总关卡</div></div>
        <div class="stat"><div class="num" id="stat-questions">200</div><div class="lbl">题库</div></div>
        <div class="stat"><div class="num" id="stat-unlocked">-</div><div class="lbl">已解锁</div></div>
        <div class="stat"><div class="num" id="stat-current">-</div><div class="lbl">当前关卡</div></div>
      </div>
      <div class="hero-actions">
        <a class="btn btn-primary" href="game.html">🚀 开始闯关</a>
        <a class="btn" href="study.html">📚 学习模式</a>
        <button class="btn btn-ghost" id="btn-reset">🔄 重置进度</button>
      </div>
    </section>

    <!-- 关卡地图 -->
    <h2 class="map-title">关卡地图</h2>
    <div class="level-grid" id="level-grid"></div>
  </main>

  <footer class="footer">百科知识大闯关 · 200 题 · 40 关 · 纯静态版</footer>

  <div id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
